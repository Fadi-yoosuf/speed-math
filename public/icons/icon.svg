<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="chk" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="24" y="24" width="24" height="24" fill="#fff"/>
      <rect x="24" width="24" height="24" fill="#111"/>
      <rect y="24" width="24" height="24" fill="#111"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- plus -->
  <rect x="96" y="178" width="152" height="40" rx="12" fill="#f97316"/>
  <rect x="152" y="122" width="40" height="152" rx="12" fill="#f97316"/>
  <!-- times -->
  <g transform="translate(348 198) rotate(45)">
    <rect x="-76" y="-20" width="152" height="40" rx="12" fill="#fff"/>
    <rect x="-20" y="-76" width="40" height="152" rx="12" fill="#fff"/>
  </g>
  <!-- road -->
  <rect x="64" y="320" width="384" height="112" rx="24" fill="#334155"/>
  <rect x="96" y="372" width="48" height="8" rx="4" fill="#fbbf24"/>
  <rect x="176" y="372" width="48" height="8" rx="4" fill="#fbbf24"/>
  <rect x="256" y="372" width="48" height="8" rx="4" fill="#fbbf24"/>
  <!-- car -->
  <rect x="300" y="340" width="112" height="56" rx="20" fill="#ef4444"/>
  <rect x="322" y="322" width="60" height="36" rx="14" fill="#fca5a5"/>
  <circle cx="324" cy="398" r="16" fill="#111"/>
  <circle cx="388" cy="398" r="16" fill="#111"/>
  <!-- flag -->
  <rect x="408" y="322" width="40" height="110" fill="url(#chk)"/>
</svg>
